<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Milestone</title>
  <style>
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; background:#0A0A0F; color:#F5F5F7; }
    .wrap { padding: 12px; width: 260px; }
    button {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #4B4B52;
      border-radius: 999px;
      background: linear-gradient(90deg, #6D28D9, #7C3AED);
      color: #F5F5F7;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(124,58,237,0.35);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h3 style="margin:0 0 8px 0;">Milestone</h3>
    <p style="margin:0 0 12px 0; color:#C9C9D1;">Open the Milestone side panel.</p>
    <button id="open">Open Side Panel</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
